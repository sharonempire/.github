name: Bug Report
description: Report a bug in any Codnov repository
labels: ["bug", "triage"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which repo is affected?
      placeholder: e.g., codnov-web, codnov-dashboard, codnov-app
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what went wrong
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (production down)
        - High (major feature broken)
        - Medium (workaround exists)
        - Low (cosmetic/minor)
    validations:
      required: true
