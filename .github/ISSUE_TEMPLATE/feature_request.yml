name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which repo should this go in?
      placeholder: e.g., codnov-web, codnov-dashboard, codnov-app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — Blocking
        - P1 — Important
        - P2 — Nice to have
        - P3 — Future consideration
    validations:
      required: true
